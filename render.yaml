# Render Blueprint: the API (Node web service) and the website (static site).
# Variables marked sync: false are entered in the Render dashboard, never committed.
# Without a custom domain, the website passes /api/* through to the API (see routes below), so the browser
# sees one address and the login cookie works. See "Deploying" in README.md.
services:
  - type: web
    name: signature-international-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: MAX_ADMINS
        value: 2
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SITE_ORIGIN
        sync: false
      - key: ADMIN1_NAME
        sync: false
      - key: ADMIN1_EMAIL
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_NAME
        sync: false
      - key: ADMIN2_EMAIL
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false

  - type: web
    name: signature-international
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Sends API calls to the API service. If Render gave the API a different address, change it here.
      - type: rewrite
        source: /api/*
        destination: https://signature-international-api.onrender.com/api/*
      # Single-page app: every path loads index.html and React Router shows the right page.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SITE_URL
        sync: false
